<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>CRISPY BITE - Quét Mã Expo Go Android</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0F172A;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      color: #DC2626;
      margin: 0 0 10px 0;
      font-size: 24px;
      letter-spacing: 1px;
    }
    p {
      color: #94A3B8;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .qr-box {
      background: #FFFFFF;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 20px;
    }
    .qr-box img {
      display: block;
      width: 220px;
      height: 220px;
    }
    .url-box {
      background: #0F172A;
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      color: #38BDF8;
      font-size: 15px;
      font-weight: bold;
      border: 1px solid #334155;
      margin-bottom: 15px;
      user-select: all;
    }
    .steps {
      text-align: left;
      font-size: 13px;
      color: #CBD5E1;
      line-height: 1.6;
    }
    .steps ol {
      padding-left: 20px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🍔 CRISPY BITE QSR</h1>
    <p>Quét mã bằng camera hoặc ứng dụng <b>Expo Go</b> trên Android</p>
    
    <div class="qr-box">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=exp://172.16.18.80:8081" alt="Expo Go QR Code" />
    </div>

    <div class="url-box">exp://172.16.18.80:8081</div>

    <div class="steps">
      <ol>
        <li>Mở ứng dụng <b>Expo Go</b> trên điện thoại Android.</li>
        <li>Bấm nút <b>"Scan QR code"</b> để quét mã ở trên.</li>
        <li>Hoặc bấm <b>"Enter URL manually"</b> và dán link màu xanh ở trên.</li>
      </ol>
    </div>
  </div>
</body>
</html>
