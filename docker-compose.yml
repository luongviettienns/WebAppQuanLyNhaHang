services:
  mysql:
    image: mysql:8.4
    container_name: crispy-bite-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_dev
      MYSQL_USER: crispy_bite
      MYSQL_PASSWORD: crispy_bite_dev_password
      MYSQL_DATABASE: crispy_bite_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
